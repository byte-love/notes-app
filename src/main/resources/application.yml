server:
  port: 8081
  address: 127.0.0.1
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 24h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: notes-app
  web:
    resources:
      static-locations: "classpath:/static/,file:/srv/data/uploads/"
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/notes
    username: notes
    password: ${PG_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
  thymeleaf:
    cache: true

notes:
  owner-username: ${OWNER_USERNAME:owner}
  owner-password: ${OWNER_PASSWORD:}
  viewer-username: ${VIEWER_USERNAME:viewer}
  viewer-password: ${VIEWER_PASSWORD:}
  tab-projects-href: ${TAB_PROJECTS_HREF:/}
  register-enabled: ${REGISTER_ENABLED:true}

logging:
  level:
    root: info
    cn.bytelove.notes: info
