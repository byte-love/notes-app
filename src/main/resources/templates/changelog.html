<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('更新日志 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap">
    <div class="section-head">
        <h1>更新日志</h1>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/changelog}" class="btn-small">管理</a>
    </div>

    <div class="filters">
        <div class="seg">
            <a th:href="@{/updates}">内容动态</a>
            <a th:href="@{/changelog}" class="on">系统日志</a>
        </div>
    </div>

    <div class="cl-timeline">
        <article class="cl-item" th:each="r, st : ${releases}">
            <div class="cl-rail">
                <span class="cl-dot"></span>
                <span class="cl-version" th:if="${r.version() != null}" th:text="${'v' + r.version()}">v4.1</span>
                <time th:text="${#temporals.format(r.releasedOn(), 'yyyy-MM-dd')}">2026-10-29</time>
            </div>

            <div class="cl-card">
                <header class="cl-card-head">
                    <h2 th:text="${r.title()}">这次更新叫什么</h2>
                    <span class="cl-latest" th:if="${st.first}">当前版本</span>
                </header>

                <section class="cl-section" th:each="s : ${r.sections()}">
                    <h3 th:if="${s.name() != null}" th:text="${s.name()}">小节名</h3>
                    <ul class="cl-points">
                        <li th:each="i : ${s.items()}" th:utext="${i.html()}">要点</li>
                    </ul>
                </section>
            </div>
        </article>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(releases)}">还没有更新记录</p>
</main>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
