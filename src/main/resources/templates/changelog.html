<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('更新日志 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap">
    <div class="section-head">
        <h1>更新日志</h1>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/changelog}" class="btn-quiet">写一条</a>
    </div>

    <div class="cl-timeline">
        <article class="cl-item" th:each="r, st : ${releases}">
            <div class="cl-rail">
                <span class="cl-dot"></span>
                <span class="cl-version" th:if="${r.version() != null}" th:text="${'v' + r.version()}">v4.1</span>
                <time th:text="${#temporals.format(r.releasedOn(), 'yyyy-MM-dd')}">2026-10-29</time>
            </div>

            <div class="cl-card" th:classappend="${!st.first} ? 'collapsed'"
                 th:attr="data-key=${#temporals.format(r.releasedOn(), 'yyyyMMdd') + '-' + (r.version() != null ? r.version() : 'x')}">
                <button type="button" class="cl-card-head">
                    <h2 th:text="${r.title()}">这次更新叫什么</h2>
                    <span class="cl-latest" th:if="${st.first}">当前版本</span>
                    <span class="cl-caret" aria-hidden="true"></span>
                </button>

                <div class="cl-body">
                    <section class="cl-section" th:each="s : ${r.sections()}">
                        <h3 th:if="${s.name() != null}" th:text="${s.name()}">小节名</h3>
                        <ul class="cl-points">
                            <li th:each="i : ${s.items()}" th:utext="${i.html()}">要点</li>
                        </ul>
                    </section>
                </div>
            </div>
        </article>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(releases)}">还没有更新记录</p>
</main>

<script>
    // 卡片可折叠：最新一版默认展开，其余默认收起；手动切换后记在 localStorage
    (() => {
        const cards = [...document.querySelectorAll('.cl-card[data-key]')];
        if (!cards.length) return;

        cards.forEach((card) => {
            const head = card.querySelector('.cl-card-head');
            const key = 'cl-fold:' + card.dataset.key;

            try {
                const saved = localStorage.getItem(key);
                if (saved === '1') card.classList.add('collapsed');
                else if (saved === '0') card.classList.remove('collapsed');
            } catch (e) {}

            const sync = () => head.setAttribute('aria-expanded', String(!card.classList.contains('collapsed')));
            sync();

            head.addEventListener('click', () => {
                card.classList.toggle('collapsed');
                sync();
                try {
                    localStorage.setItem(key, card.classList.contains('collapsed') ? '1' : '0');
                } catch (e) {}
            });
        });
    })();
</script>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
