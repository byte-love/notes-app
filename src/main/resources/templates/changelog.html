<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('更新日志 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap">
    <div class="section-head">
        <h1>更新日志</h1>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/changelog}" class="btn-quiet">写一条</a>
    </div>

    <div class="cl-timeline">
        <!-- 一天一张卡：同一天发的几个版本收在卡里，按版本分块（单版本的日子不显示版本行） -->
        <article class="cl-item" th:each="d, st : ${days}">
            <div class="cl-rail">
                <span class="cl-dot"></span>
                <time th:text="${#temporals.format(d.releasedOn(), 'yyyy-MM-dd')}">2026-10-29</time>
                <span class="cl-versions">
                    <span class="cl-version" th:each="r : ${d.releases()}"
                          th:if="${r.version() != null}" th:text="${'v' + r.version()}">v4.1</span>
                </span>
            </div>

            <div class="cl-card" th:classappend="${!st.first} ? 'collapsed'"
                 th:attr="data-key=${#temporals.format(d.releasedOn(), 'yyyyMMdd')}">
                <button type="button" class="cl-card-head">
                    <span class="cl-version" th:if="${#lists.size(d.releases()) > 1 and d.releases().get(0).version() != null}"
                          th:text="${'v' + d.releases().get(0).version()}">v1.1.2</span>
                    <h2 th:text="${d.releases().get(0).title()}">这次更新叫什么</h2>
                    <span class="cl-latest" th:if="${st.first}">当前版本</span>
                    <span class="cl-caret" aria-hidden="true"></span>
                </button>

                <div class="cl-body">
                    <div class="cl-ver" th:each="r, rs : ${d.releases()}">
                        <!-- 第一版的信息已经在卡片头上，这里只列后面的版本 -->
                        <h3 class="cl-ver-head" th:if="${!rs.first}">
                            <span class="cl-version" th:if="${r.version() != null}" th:text="${'v' + r.version()}">v1.1.2</span>
                            <span th:text="${r.title()}">这版做了什么</span>
                        </h3>

                        <!-- 修复 / 优化 / 清理这类小节默认折叠：想看的人再展开，不占版面 -->
                        <section class="cl-section" th:each="s : ${r.sections()}">
                            <details class="cl-fold"
                                     th:if="${s.name() != null and (#strings.contains(s.name(), '修复') or #strings.contains(s.name(), '优化') or #strings.contains(s.name(), '清理'))}">
                                <summary th:text="${s.name()}">修复与优化</summary>
                                <ul class="cl-points">
                                    <li th:each="i : ${s.items()}" th:utext="${i.html()}">要点</li>
                                </ul>
                            </details>
                            <th:block th:unless="${s.name() != null and (#strings.contains(s.name(), '修复') or #strings.contains(s.name(), '优化') or #strings.contains(s.name(), '清理'))}">
                                <h4 th:if="${s.name() != null}" th:text="${s.name()}">小节名</h4>
                                <ul class="cl-points">
                                    <li th:each="i : ${s.items()}" th:utext="${i.html()}">要点</li>
                                </ul>
                            </th:block>
                        </section>
                    </div>
                </div>
            </div>
        </article>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(days)}">还没有更新记录</p>
</main>

<script>
    // 卡片可折叠：最新一版默认展开，其余默认收起；手动切换后记在 localStorage
    (() => {
        const cards = [...document.querySelectorAll('.cl-card[data-key]')];
        if (!cards.length) return;

        cards.forEach((card) => {
            const head = card.querySelector('.cl-card-head');
            const key = 'cl-fold:' + card.dataset.key;

            try {
                const saved = localStorage.getItem(key);
                if (saved === '1') card.classList.add('collapsed');
                else if (saved === '0') card.classList.remove('collapsed');
            } catch (e) {}

            const sync = () => head.setAttribute('aria-expanded', String(!card.classList.contains('collapsed')));
            sync();

            head.addEventListener('click', () => {
                card.classList.toggle('collapsed');
                sync();
                try {
                    localStorage.setItem(key, card.classList.contains('collapsed') ? '1' : '0');
                } catch (e) {}
            });
        });
    })();
</script>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
