<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head(${root.title + ' · 推荐'})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap wide">
    <a th:replace="~{fragments/layout :: back(@{/explore})}"></a>

    <div class="rec-head">
        <div class="rec-head-main">
            <span class="badge" th:text="${kindLabel}">八股</span>
            <h1 th:text="${root.title}">标题</h1>
            <p class="rec-count" th:text="|共 ${#lists.size(items)} 条|">共 1 条</p>
        </div>

        <form sec:authorize="isAuthenticated()"
              th:action="@{/explore/copy/{id}(id=${root.id})}" method="post" class="rec-action">
            <button type="submit" class="btn-new">全部加入</button>
        </form>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn-new">全部加入</a>
    </div>

    <ul class="rec-list">
        <li th:each="i : ${items}" th:classappend="${i.id == root.id} ? 'is-root' : ''">
            <div class="rec-main">
                <a th:unless="${lockedIds != null and lockedIds.contains(i.id)}" class="rec-title"
                   th:href="${basePath + '/' + i.slug}" th:text="${i.title}">标题</a>
                <span th:if="${lockedIds != null and lockedIds.contains(i.id)}"
                      class="rec-title locked" th:text="${i.title}">标题</span>
                <p class="rec-summary" th:if="${i.summary != null}" th:text="${i.summary}">摘要</p>
            </div>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/explore/copy/{id}(id=${i.id})}" method="post" class="rec-action">
                <button type="submit" class="btn-small">加入</button>
            </form>
        </li>
    </ul>
</main>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
