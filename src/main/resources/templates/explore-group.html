<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head(${root.title + ' · 推荐'})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap wide">
    <a th:href="@{/explore}" class="back-link">返回</a>

    <div class="section-head">
        <h1 th:text="${root.title}">标题</h1>
        <form sec:authorize="isAuthenticated()" th:action="@{/explore/copy/{id}(id=${root.id})}" method="post" class="inline">
            <button type="submit" class="btn-small">全部加入</button>
        </form>
    </div>

    <p class="muted" th:text="|${kindLabel} · 共 ${#lists.size(items)} 条|">八股 · 共 31 条</p>

    <ul class="item-list">
        <li th:each="i : ${items}" th:classappend="${i.id == root.id} ? 'is-root' : ''">
            <div class="item-main">
                <a th:unless="${lockedIds != null and lockedIds.contains(i.id)}" class="item-title"
                   th:href="${basePath + '/' + i.slug}" th:text="${i.title}">标题</a>
                <a th:if="${lockedIds != null and lockedIds.contains(i.id)}" class="item-title locked"
                   th:href="@{/login}" title="需要登录后查看" th:text="${i.title}">标题</a>
                <form sec:authorize="isAuthenticated()"
                      th:action="@{/explore/copy/{id}(id=${i.id})}" method="post" class="inline">
                    <button type="submit" class="link-button">加入</button>
                </form>
            </div>
            <p class="item-summary" th:if="${i.summary != null}" th:text="${i.summary}">摘要</p>
        </li>
    </ul>
</main>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
