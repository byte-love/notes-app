<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('收藏夹 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap wide">
    <div class="page-head">
        <h1>收藏夹</h1>
        <span class="count" th:text="${total} + ' 条'">0 条</span>
    </div>

    <p class="muted" th:if="${total == 0}">
        还没有标记的内容，在任意一条内容详情页点「☆ 收藏」。
    </p>

    <section th:each="g : ${grouped}" th:if="${total > 0}">
        <h2 class="memo-group" th:text="${g.key}">分组</h2>
        <ul class="item-list memo-list">
            <li th:each="i : ${g.value}">
                <div class="item-main">
                    <a class="item-title" th:href="${basePathOf.apply(i.kind) + '/' + i.slug}"
                       th:text="${i.title}">标题</a>
                </div>
                <p class="item-summary" th:if="${i.summary != null}" th:text="${i.summary}">摘要</p>
                <form th:action="@{/star/{s}(s=${i.slug})}" method="post" class="inline item-action">
                    <button type="submit" class="star-btn on">★ 移出</button>
                </form>
            </li>
        </ul>
    </section>
</main>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
