<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('管理 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap wide">
    <div class="section-head">
        <h1>管理</h1>
        <a th:href="@{/admin/new}" class="btn-new">
            <svg class="plus" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            新建
        </a>
    </div>

    <div class="filters">
        <div class="seg">
            <a th:href="@{/admin(range=${filterRange},q=${filterQ})}"
               th:classappend="${filterKind == null} ? 'on'">全部</a>
            <a th:each="k : ${kinds}"
               th:href="@{/admin(kind=${k},range=${filterRange},q=${filterQ})}"
               th:classappend="${filterKind == k} ? 'on'" th:text="${k.label}">笔记</a>
        </div>

        <div class="seg">
            <a th:href="@{/admin(kind=${filterKind},q=${filterQ})}"
               th:classappend="${filterRange == null} ? 'on'">全部</a>
            <a th:href="@{/admin(kind=${filterKind},range=7,q=${filterQ})}"
               th:classappend="${filterRange == 7} ? 'on'">近 7 天</a>
            <a th:href="@{/admin(kind=${filterKind},range=30,q=${filterQ})}"
               th:classappend="${filterRange == 30} ? 'on'">近 30 天</a>
        </div>

        <form th:action="@{/admin}" method="get" class="filter-search">
            <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="7" cy="7" r="4.3" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="search" name="q" th:value="${filterQ}" placeholder="搜索标题或 slug">
            <input type="hidden" name="kind" th:if="${filterKind != null}" th:value="${filterKind}">
            <input type="hidden" name="range" th:if="${filterRange != null}" th:value="${filterRange}">
        </form>
    </div>

    <p class="filter-summary" th:if="${filterKind != null or filterRange != null or filterQ != null}">
        筛出 <span th:text="${#lists.size(items)}">0</span> 条
        <a th:href="@{/admin}" class="filter-clear">清除</a>
    </p>

    <div class="table-scroll" th:if="${!#lists.isEmpty(items)}">
        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>类型</th>
                <th>Slug</th>
                <th>标题</th>
                <th>可见性</th>
                <th>更新时间</th>
                <th class="actions">操作</th>
            </tr>
            </thead>
            <tbody>
            <!-- 每行压成一行输出：313 行时缩进空白能占到一百多 KB。
                 链接也不用 @{}（每行两个链接过 LinkBuilder，313 行要多花几十毫秒），
                 直接拿 contextPath 拼——admin 列表是纯内部页，没有 URL 重写的需求 -->
            <tr th:each="i : ${items}"><td class="cell-id" th:text="${i.id}">1</td><td th:text="${i.kind.label}">笔记</td><td><code th:text="${i.slug}">slug</code></td><td class="cell-title" th:text="${i.title}">标题</td><td><span class="badge" th:text="${i.visibility.label}">公开</span></td><td th:text="${#temporals.format(i.updatedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td><td class="actions"><div class="row-actions"><a th:attr="href=${#request.contextPath + '/admin/' + i.id + '/edit'}">编辑</a><button type="submit" form="row-del" th:attr="formaction=${#request.contextPath + '/admin/' + i.id + '/delete'}" class="link-button danger" onclick="return confirm('确认删除？删掉的内容会在回收站保留 30 天。');">删除</button></div></td></tr>
            </tbody>
        </table>
        <!-- 删除按钮共用一个表单：以前每行一个 <form> + 一份 CSRF token，313 行多出 40KB -->
        <form id="row-del" th:action="@{/admin/0/delete}" method="post" hidden>
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        </form>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(items)}">
        <span th:if="${filterKind != null or filterRange != null or filterQ != null}">没有符合条件的内容</span>
        <span th:unless="${filterKind != null or filterRange != null or filterQ != null}">还没有内容</span>
    </p>
</main>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
