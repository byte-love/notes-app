<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('站内助手 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap agent-page">
    <h1 class="settings-title">站内助手</h1>

    <div class="agent-key">
        <label for="agentKey">API Key</label>
        <input id="agentKey" type="password" autocomplete="off" spellcheck="false">
        <button id="agentSave" type="button" class="btn-quiet">保存</button>
    </div>

    <div id="agentMessages" class="agent-messages"></div>

    <div class="agent-compose">
        <textarea id="agentInput" rows="4"></textarea>
        <div class="agent-actions">
            <input id="agentFile" type="file" accept=".md,.txt">
            <button id="agentSend" type="button" class="btn-quiet">发送</button>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: foot}"></footer>
<script th:src="@{/js/agent.js(v=1)}"></script>
</body>
</html>
