<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 整棵树：只有最外层带 .tree；子层用 sub（裸 <ul>），
     否则「分组之间的分隔线」（.tree > li + li）会套到每一层，叶子之间也长出横线 -->
<ul th:fragment="nodes(nodes)" class="tree">
    <th:block th:replace="~{fragments/tree :: items(${nodes})}"></th:block>
</ul>

<!-- 子层：裸 <ul>，由上层 <li> 自己包 -->
<ul th:fragment="sub(nodes)">
    <th:block th:replace="~{fragments/tree :: items(${nodes})}"></th:block>
</ul>

<!-- 一行行的 <li>：分组是折叠按钮，叶子是链接；叶子带行号 -->
<th:block th:fragment="items(nodes)">
    <li th:each="n : ${nodes}" th:classappend="${n.hasChildren()} ? 'has-kids' : ''">
        <button th:if="${n.hasChildren() or n.lazy()}" type="button" class="tree-group"
                th:attr="data-key=${n.item.slug},data-lazy=${n.lazy()} ? ${treeBase + '?parent=' + n.item.slug} : null"
                th:classappend="${activeId != null and activeId == n.item.id} ? 'on'">
            <span class="tree-group-title" th:text="${n.item.title}">分组</span>
            <!-- 分组标题右侧给个条数，一行里有点信息量，不至于只有一串标题 -->
            <span class="tree-count" th:if="${!n.lazy()}" th:text="${#lists.size(n.children)}">0</span>
        </button>
        <a th:unless="${n.hasChildren() or n.lazy() or n.locked()}"
           th:href="${basePath + '/' + n.item.slug}"
           th:classappend="${activeId != null and activeId == n.item.id} ? 'on'"><span
                class="tree-num" th:text="${#numbers.formatInteger(n.ordinal(), 2)}">01</span><span
                class="tree-lastread" th:if="${lastReadId != null and lastReadId == n.item.id}"
                title="上次看到这里"></span><span
                class="tree-bookmark" th:if="${bookmarkIds != null and bookmarkIds.contains(n.item.id)}"
                title="已加书签"></span><span
                class="tree-star" th:if="${starIds != null and starIds.contains(n.item.id)}">★</span><span
                th:text="${n.item.title}"></span></a>
        <a th:if="${not n.hasChildren() and n.locked()}" class="locked" th:href="@{/login}" title="需要登录后查看">
            <span class="tree-num" th:text="${#numbers.formatInteger(n.ordinal(), 2)}">01</span><span
                th:text="${n.item.title}"></span>
        </a>
        <ul th:if="${n.hasChildren()}">
            <th:block th:replace="~{fragments/tree :: items(${n.children})}"></th:block>
        </ul>
    </li>
</th:block>

</body>
</html>
