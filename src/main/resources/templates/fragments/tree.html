<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<ul th:fragment="nodes(nodes)" class="tree">
    <li th:each="n : ${nodes}" th:classappend="${n.hasChildren()} ? 'has-kids' : ''">
        <button th:if="${n.hasChildren() or n.lazy()}" type="button" class="tree-group"
                th:attr="data-key=${n.item.slug},data-lazy=${n.lazy()} ? ${basePath + '/tree?parent=' + n.item.slug} : null"
                th:text="${n.item.title}"
                th:classappend="${activeId != null and activeId == n.item.id} ? 'on'"></button>
        <a th:unless="${n.hasChildren() or n.locked()}"
           th:href="${basePath + '/' + n.item.slug}"
           th:classappend="${activeId != null and activeId == n.item.id} ? 'on'"><span
                class="tree-lastread" th:if="${lastReadId != null and lastReadId == n.item.id}"
                title="上次看到这里"></span><span
                class="tree-bookmark" th:if="${bookmarkIds != null and bookmarkIds.contains(n.item.id)}"
                title="已加书签"></span><span
                class="tree-star" th:if="${starIds != null and starIds.contains(n.item.id)}">★</span><span
                th:text="${n.item.title}"></span></a>
        <a th:if="${not n.hasChildren() and n.locked()}" class="locked" th:href="@{/login}" title="需要登录后查看">
            <span th:text="${n.item.title}"></span>
        </a>
        <th:block th:if="${n.hasChildren()}">
            <ul th:replace="~{fragments/tree :: nodes(${n.children})}"></ul>
        </th:block>
    </li>
</ul>
</body>
</html>
