<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <title th:text="${pageTitle}">notes</title>
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
    <script th:inline="javascript">
        (() => {
            try {
                const theme = localStorage.getItem('theme');
                if (theme === 'light' || theme === 'dark' || theme === 'sepia') {
                    document.documentElement.dataset.theme = theme;
                }
                const size = localStorage.getItem('read-size');
                if (size === 'sm' || size === 'md' || size === 'lg') {
                    document.documentElement.dataset.readSize = size;
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css(v=44)}">
</head>
<body>

<header th:fragment="nav" class="site-header">
    <div class="header-inner">
        <nav class="tabs" aria-label="站点分区">
            <a class="tab" th:href="@{/projects}"
               th:classappend="${tabActive == 'project'} ? 'is-active'">项目</a>
            <a class="tab" th:href="@{/notes}"
               th:classappend="${tabActive == 'note'} ? 'is-active'">笔记</a>
            <a class="tab" th:href="@{/bagu}"
               th:classappend="${tabActive == 'bagu'} ? 'is-active'">八股</a>
            <a class="tab" th:href="@{/algo}"
               th:classappend="${tabActive == 'algo'} ? 'is-active'">算法</a>
            <a class="tab" th:href="@{/explore}"
               th:classappend="${tabActive == 'explore'} ? 'is-active'">推荐</a>
            <a class="tab" th:href="@{/changelog}"
               th:classappend="${tabActive == 'updates'} ? 'is-active'">更新日志</a>
        </nav>
        <div class="header-tools">
            <a sec:authorize="isAuthenticated()" th:href="@{/admin}">管理</a>
            <a sec:authorize="isAuthenticated()" th:if="${navUser != null}"
               th:href="@{/me}" class="user-entry" th:title="${navUser.name()}">
                <span class="user-dot" th:style="|--h:${navUser.hue()}|"
                      th:text="${navUser.initial()}">U</span>
                <span class="user-name" th:text="${navUser.name()}">用户名</span>
            </a>
            <a sec:authorize="!isAuthenticated()" th:if="${registerEnabled}" th:href="@{/register}">注册</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}">登录</a>
            <button class="theme-toggle" type="button" aria-label="切换深浅色">☀</button>
        </div>
    </div>
</header>

<th:block th:fragment="foot">
<script>
    // 自制下拉：原生 select 的弹层是系统画的，改不动样式，所以自己实现一个
    (() => {
        const selects = [...document.querySelectorAll('.select')];
        if (!selects.length) return;

        const closeAll = () => {
            selects.forEach((s) => {
                s.classList.remove('open');
                s.querySelector('.select-panel').hidden = true;
            });
        };

        selects.forEach((sel) => {
            const btn = sel.querySelector('.select-btn');
            const panel = sel.querySelector('.select-panel');
            const text = sel.querySelector('.select-text');
            const input = sel.querySelector('input[type="hidden"]');
            const filter = sel.querySelector('.select-filter');
            const items = [...sel.querySelectorAll('.select-list li')];

            const mark = (value) => {
                items.forEach((li) => li.classList.toggle('on', li.dataset.value === value));
            };

            const apply = (value) => {
                const li = items.find((x) => x.dataset.value === value);
                if (!li) return;
                input.value = li.dataset.value;
                text.textContent = li.dataset.label || li.textContent.trim();
                mark(li.dataset.value);
            };

            apply(input.value);

            btn.addEventListener('click', () => {
                const wasOpen = sel.classList.contains('open');
                closeAll();
                if (wasOpen) return;
                sel.classList.add('open');
                panel.hidden = false;
                if (filter) {
                    filter.value = '';
                    items.forEach((li) => li.classList.remove('hide'));
                    filter.focus();
                }
                const on = items.find((li) => li.classList.contains('on'));
                if (on) on.scrollIntoView({ block: 'nearest' });
            });

            items.forEach((li) => {
                li.addEventListener('click', () => {
                    apply(li.dataset.value);
                    closeAll();
                });
            });

            if (filter) {
                filter.addEventListener('input', () => {
                    const q = filter.value.trim().toLowerCase();
                    items.forEach((li) => {
                        const name = (li.dataset.label || li.textContent).toLowerCase();
                        li.classList.toggle('hide', q !== '' && !name.includes(q));
                    });
                });
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.select')) closeAll();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAll();
        });
    })();
</script>

<script>
    // 表单里行末那个问号：点一下在旁边弹出说明
    (() => {
        const triggers = document.querySelectorAll('.help[data-help]');
        if (!triggers.length) return;

        const tip = document.createElement('div');
        tip.className = 'gl-tip';
        document.body.appendChild(tip);

        let current = null;

        const hide = () => {
            current = null;
            tip.classList.remove('on');
        };

        const show = (el) => {
            current = el;
            tip.textContent = el.getAttribute('data-help');
            tip.style.left = '0px';
            tip.style.top = '0px';
            tip.classList.add('on');

            const r = el.getBoundingClientRect();
            const tw = tip.offsetWidth;
            const th = tip.offsetHeight;
            let left = r.left + r.width / 2 - tw / 2;
            left = Math.max(12, Math.min(left, window.innerWidth - tw - 12));
            let top = r.bottom + 8;
            if (top + th > window.innerHeight - 12) top = r.top - th - 8;
            tip.style.left = Math.round(left) + 'px';
            tip.style.top = Math.round(Math.max(12, top)) + 'px';
        };

        document.addEventListener('click', (e) => {
            const el = e.target.closest('.help[data-help]');
            if (el) {
                e.preventDefault();
                e.stopPropagation();
                if (current === el) hide();
                else show(el);
                return;
            }
            hide();
        });

        window.addEventListener('scroll', hide, { passive: true });
        window.addEventListener('resize', hide);
    })();
</script>

<script>
    (() => {
        const btn = document.querySelector('.theme-toggle');
        if (!btn) return;
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const current = () => document.documentElement.dataset.theme || (mq.matches ? 'dark' : 'light');
        const sync = () => { btn.textContent = current() === 'dark' ? '☀' : '☾'; };
        sync();
        btn.addEventListener('click', () => {
            const next = current() === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem('theme', next); } catch (e) {}
            sync();
        });
    })();
</script>

<script>
    // 树的分组折叠状态记在 localStorage，下次进来自动恢复
    (() => {
        const buttons = document.querySelectorAll('.tree-group[data-key]');
        if (!buttons.length) return;
        buttons.forEach((btn) => {
            const li = btn.closest('li');
            if (!li) return;
            const key = 'tree-fold:' + btn.dataset.key;
            try {
                if (localStorage.getItem(key) === '1') li.classList.add('folded');
            } catch (e) {}
            btn.addEventListener('click', () => {
                li.classList.toggle('folded');
                try {
                    localStorage.setItem(key, li.classList.contains('folded') ? '1' : '0');
                } catch (e) {}
            });
        });
    })();
</script>
</th:block>

</body>
</html>
