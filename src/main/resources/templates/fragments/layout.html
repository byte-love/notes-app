<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">notes</title>
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
    <script th:inline="javascript">
        (() => {
            try {
                const saved = localStorage.getItem('theme');
                if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css(v=10)}">
</head>
<body>

<header th:fragment="nav" class="site-header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">byte-love</a>
        <nav class="tabs" aria-label="站点分区">
            <a class="tab" th:href="${tabProjectsHref}">项目</a>
            <a class="tab" th:href="@{/notes}"
               th:classappend="${tabActive == null or tabActive == 'note'} ? 'is-active'">笔记</a>
            <a class="tab" th:href="@{/bagu}"
               th:classappend="${tabActive == 'bagu'} ? 'is-active'">八股</a>
            <a class="tab" th:href="@{/algo}"
               th:classappend="${tabActive == 'algo'} ? 'is-active'">算法</a>
        </nav>
        <div class="header-tools">
            <a sec:authorize="isAuthenticated()" th:href="@{/memo}">备忘录</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">后台</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="link-button">退出</button>
            </form>
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}">登录</a>
            <button class="theme-toggle" type="button" aria-label="切换深浅色">☀</button>
        </div>
    </div>
</header>

<th:block th:fragment="foot">
<footer class="site-footer">
    <span>byte-love</span>
</footer>

<script>
    (() => {
        const btn = document.querySelector('.theme-toggle');
        if (!btn) return;
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const current = () => document.documentElement.dataset.theme || (mq.matches ? 'dark' : 'light');
        const sync = () => { btn.textContent = current() === 'dark' ? '☀' : '☾'; };
        sync();
        btn.addEventListener('click', () => {
            const next = current() === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem('theme', next); } catch (e) {}
            sync();
        });
    })();
</script>

<script>
    // 树的分组折叠状态记在 localStorage，下次进来自动恢复
    (() => {
        const buttons = document.querySelectorAll('.tree-group[data-key]');
        if (!buttons.length) return;
        buttons.forEach((btn) => {
            const li = btn.closest('li');
            if (!li) return;
            const key = 'tree-fold:' + btn.dataset.key;
            try {
                if (localStorage.getItem(key) === '1') li.classList.add('folded');
            } catch (e) {}
            btn.addEventListener('click', () => {
                li.classList.toggle('folded');
                try {
                    localStorage.setItem(key, li.classList.contains('folded') ? '1' : '0');
                } catch (e) {}
            });
        });
    })();
</script>
</th:block>

</body>
</html>
