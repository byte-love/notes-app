<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <title th:text="${pageTitle}">notes</title>
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
    <script th:inline="javascript">
        (() => {
            try {
                const theme = localStorage.getItem('theme');
                if (theme === 'light' || theme === 'dark' || theme === 'sepia') {
                    document.documentElement.dataset.theme = theme;
                }
                const size = localStorage.getItem('read-size');
                if (size === 'sm' || size === 'md' || size === 'lg') {
                    document.documentElement.dataset.readSize = size;
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css(v=54)}">
</head>
<body>

<!-- 杩斿洖锛氭湁娴忚鍘嗗彶灏卞洖涓婁竴椤碉紝娌℃湁灏辨寜浼犺繘鏉ョ殑 href 璧?-->
<a th:fragment="back(href)" class="back-link" th:href="${href}"
   onclick="if (history.length > 1) { history.back(); return false; }">杩斿洖</a>

<header th:fragment="nav" class="site-header">
    <div class="header-inner">
        <nav class="tabs" aria-label="绔欑偣鍒嗗尯">
            <a class="tab" th:href="@{/projects}"
               th:classappend="${tabActive == 'project'} ? 'is-active'">椤圭洰</a>
            <a class="tab" th:href="@{/notes}"
               th:classappend="${tabActive == 'note'} ? 'is-active'">绗旇</a>
            <a class="tab" th:href="@{/bagu}"
               th:classappend="${tabActive == 'bagu'} ? 'is-active'">鍏偂</a>
            <a class="tab" th:href="@{/algo}"
               th:classappend="${tabActive == 'algo'} ? 'is-active'">绠楁硶</a>
            <a class="tab" th:href="@{/explore}"
               th:classappend="${tabActive == 'explore'} ? 'is-active'">鎺ㄨ崘</a>
            <a class="tab" th:href="@{/changelog}"
               th:classappend="${tabActive == 'updates'} ? 'is-active'">鏇存柊鏃ュ織</a>
        </nav>
        <div class="header-tools">
            <a sec:authorize="isAuthenticated()" th:href="@{/admin}">绠＄悊</a>
            <a sec:authorize="isAuthenticated()" th:if="${navUser != null}"
               th:href="@{/me}" class="user-entry" th:title="${navUser.name()}">
                <span class="user-dot" th:style="|--h:${navUser.hue()}|"
                      th:text="${navUser.initial()}">U</span>
                <span class="user-name" th:text="${navUser.name()}">鐢ㄦ埛鍚?/span>
            </a>
            <a sec:authorize="!isAuthenticated()" th:if="${registerEnabled}" th:href="@{/register}">娉ㄥ唽</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}">鐧诲綍</a>
            <button class="theme-toggle" type="button" aria-label="鍒囨崲娣辨祬鑹?>鈽€</button>
        </div>
    </div>
</header>

<th:block th:fragment="foot">
<script>
    // 鑷埗涓嬫媺锛氬師鐢?select 鐨勫脊灞傛槸绯荤粺鐢荤殑锛屾敼涓嶅姩鏍峰紡锛屾墍浠ヨ嚜宸卞疄鐜颁竴涓?
    (() => {
        const selects = [...document.querySelectorAll('.select')];
        if (!selects.length) return;

        const closeAll = () => {
            selects.forEach((s) => {
                s.classList.remove('open');
                s.querySelector('.select-panel').hidden = true;
            });
        };

        selects.forEach((sel) => {
            const btn = sel.querySelector('.select-btn');
            const panel = sel.querySelector('.select-panel');
            const text = sel.querySelector('.select-text');
            const input = sel.querySelector('input[type="hidden"]');
            const filter = sel.querySelector('.select-filter');
            const items = [...sel.querySelectorAll('.select-list li')];

            const mark = (value) => {
                items.forEach((li) => li.classList.toggle('on', li.dataset.value === value));
            };

            const apply = (value) => {
                const li = items.find((x) => x.dataset.value === value);
                if (!li) return;
                input.value = li.dataset.value;
                text.textContent = li.dataset.label || li.textContent.trim();
                mark(li.dataset.value);
            };

            apply(input.value);

            btn.addEventListener('click', () => {
                const wasOpen = sel.classList.contains('open');
                closeAll();
                if (wasOpen) return;
                sel.classList.add('open');
                panel.hidden = false;
                if (filter) {
                    filter.value = '';
                    items.forEach((li) => li.classList.remove('hide'));
                    filter.focus();
                }
                const on = items.find((li) => li.classList.contains('on'));
                if (on) on.scrollIntoView({ block: 'nearest' });
            });

            items.forEach((li) => {
                li.addEventListener('click', () => {
                    apply(li.dataset.value);
                    closeAll();
                });
            });

            if (filter) {
                filter.addEventListener('input', () => {
                    const q = filter.value.trim().toLowerCase();
                    items.forEach((li) => {
                        const name = (li.dataset.label || li.textContent).toLowerCase();
                        li.classList.toggle('hide', q !== '' && !name.includes(q));
                    });
                });
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.select')) closeAll();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAll();
        });
    })();
</script>

<script>
    // 琛ㄥ崟閲岃鏈偅涓棶鍙凤細鐐逛竴涓嬪湪鏃佽竟寮瑰嚭璇存槑
    (() => {
        const triggers = document.querySelectorAll('.help[data-help]');
        if (!triggers.length) return;

        const tip = document.createElement('div');
        tip.className = 'gl-tip';
        document.body.appendChild(tip);

        let current = null;

        const hide = () => {
            current = null;
            tip.classList.remove('on');
        };

        const show = (el) => {
            current = el;
            tip.textContent = el.getAttribute('data-help');
            tip.style.left = '0px';
            tip.style.top = '0px';
            tip.classList.add('on');

            const r = el.getBoundingClientRect();
            const tw = tip.offsetWidth;
            const th = tip.offsetHeight;
            let left = r.left + r.width / 2 - tw / 2;
            left = Math.max(12, Math.min(left, window.innerWidth - tw - 12));
            let top = r.bottom + 8;
            if (top + th > window.innerHeight - 12) top = r.top - th - 8;
            tip.style.left = Math.round(left) + 'px';
            tip.style.top = Math.round(Math.max(12, top)) + 'px';
        };

        document.addEventListener('click', (e) => {
            const el = e.target.closest('.help[data-help]');
            if (el) {
                e.preventDefault();
                e.stopPropagation();
                if (current === el) hide();
                else show(el);
                return;
            }
            hide();
        });

        window.addEventListener('scroll', hide, { passive: true });
        window.addEventListener('resize', hide);
    })();
</script>

<script>
    (() => {
        const btn = document.querySelector('.theme-toggle');
        if (!btn) return;
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const current = () => document.documentElement.dataset.theme || (mq.matches ? 'dark' : 'light');
        const sync = () => { btn.textContent = current() === 'dark' ? '鈽€' : '鈽?; };
        sync();
        btn.addEventListener('click', () => {
            const next = current() === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem('theme', next); } catch (e) {}
            sync();
        });
    })();
</script>

<script>
    // 鏍戠殑鍒嗙粍鎶樺彔鐘舵€佽鍦?localStorage锛屼笅娆¤繘鏉ヨ嚜鍔ㄦ仮澶?
    (() => {
        const buttons = document.querySelectorAll('.tree-group[data-key]');
        if (!buttons.length) return;

        // 鎶樺彔鐘舵€佽鍦?localStorage锛沝ata-lazy 鐨勮妭鐐瑰瓙鍒楄〃杩樻病娓叉煋锛岀涓€娆″睍寮€鏃跺幓鍙?
        const bind = (btn) => {
            const li = btn.closest('li');
            if (!li || btn.dataset.bound === '1') return;
            btn.dataset.bound = '1';
            const key = 'tree-fold:' + btn.dataset.key;
            try {
                if (localStorage.getItem(key) === '1') li.classList.add('folded');
            } catch (e) {}
            btn.addEventListener('click', async () => {
                const lazy = btn.dataset.lazy;
                if (lazy && !li.querySelector(':scope > ul')) {
                    btn.dataset.loading = '1';
                    try {
                        const res = await fetch(lazy, { credentials: 'same-origin' });
                        if (res.ok) {
                            li.insertAdjacentHTML('beforeend', await res.text());
                            li.querySelectorAll('.tree-group[data-key]').forEach(bind);
                        }
                    } catch (e) {
                        /* 鍙栦笉鍒板氨鍙槸灞曞紑涓嶄簡锛屼笉褰卞搷鍒殑 */
                    }
                    delete btn.dataset.lazy;
                    delete btn.dataset.loading;
                    li.classList.remove('folded');
                    try { localStorage.setItem(key, '0'); } catch (e) {}
                    return;
                }
                li.classList.toggle('folded');
                try {
                    localStorage.setItem(key, li.classList.contains('folded') ? '1' : '0');
                } catch (e) {}
            });
        };

        buttons.forEach(bind);
    })();
</script>

<script>
    // 婊氬姩鏉★細婊氬姩鏃舵槸瀹炶壊锛屽仠鎵?3 绉掑悗鎱㈡參娣″埌鍙墿涓€鍦堣疆寤撱€?
    // scrollbar-color 涓嶈兘鐢?CSS 杩囨浮锛屾墍浠ヨ繖閲岃嚜宸辨彃鍊煎啓 --sb-thumb銆?
    // 棰滆壊鍙湪鍚姩鏃惰涓€娆★紙婊氬姩閲屽弽澶?getComputedStyle 浼氬己鍒堕噸绠楁牱寮忥紝婊戣捣鏉ュ彂娑╋級锛?
    // 鍒囦富棰樻椂鍐嶉噸璇汇€?
    (() => {
        const root = document.documentElement;

        const parse = (value) => {
            const rgb = (value || '').match(/rgba?\(([^)]+)\)/);
            if (rgb) {
                const p = rgb[1].split(',').map((x) => parseFloat(x));
                return [p[0] || 0, p[1] || 0, p[2] || 0, p.length > 3 ? p[3] : 1];
            }
            let hex = (value || '').replace('#', '').trim();
            if (hex.length === 3) hex = hex.split('').map((x) => x + x).join('');
            return [
                parseInt(hex.slice(0, 2), 16) || 0,
                parseInt(hex.slice(2, 4), 16) || 0,
                parseInt(hex.slice(4, 6), 16) || 0,
                1,
            ];
        };

        const read = (name, fallback) => parse((getComputedStyle(root).getPropertyValue(name) || '').trim() || fallback);

        let active;
        let idle;

        const apply = (c) => root.style.setProperty('--sb-thumb', `rgba(${Math.round(c[0])}, ${Math.round(c[1])}, ${Math.round(c[2])}, ${c[3].toFixed(3)})`);
        const load = () => {
            active = read('--sb-active', 'rgba(120,120,120,0.9)');
            idle = read('--sb-idle', 'rgba(120,120,120,0.12)');
        };

        let frame = 0;
        let idleTimer = 0;

        const fadeTo = (target, ms) => {
            cancelAnimationFrame(frame);
            const from = idle.slice();
            const start = performance.now();
            const step = (now) => {
                const t = Math.min(1, (now - start) / ms);
                const k = 1 - Math.pow(1 - t, 3); // 鍏堝揩鍚庢參
                apply([
                    from[0] + (target[0] - from[0]) * k,
                    from[1] + (target[1] - from[1]) * k,
                    from[2] + (target[2] - from[2]) * k,
                    from[3] + (target[3] - from[3]) * k,
                ]);
                if (t < 1) frame = requestAnimationFrame(step);
            };
            frame = requestAnimationFrame(step);
        };

        let shown = null;
        const onScroll = () => {
            if (shown !== 'active') {
                cancelAnimationFrame(frame);
                apply(active);
                shown = 'active';
            }
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                shown = 'idle';
                fadeTo(idle, 700);
            }, 3000);
        };

        load();
        apply(idle);
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('wheel', onScroll, { passive: true });
        window.addEventListener('touchmove', onScroll, { passive: true });

        // 鍒囦富棰樺悗閲嶆柊璇讳竴閬嶉鑹?
        new MutationObserver(() => {
            load();
            apply(shown === 'active' ? active : idle);
        }).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
    })();
</script>
</th:block>

</body>
</html>
