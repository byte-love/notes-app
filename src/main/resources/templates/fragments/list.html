<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 一张卡片；分类小节和二级小节共用 -->
<th:block th:fragment="card(i, basePath)">
    <li>
        <div class="item-main">
            <a th:unless="${lockedIds.contains(i.id)}" class="item-title"
               th:href="${basePath + '/' + i.slug}" th:text="${i.title}">标题</a>
            <a th:if="${lockedIds.contains(i.id)}" class="item-title locked"
               th:href="@{/login}" title="需要登录后查看">
                <span th:text="${i.title}"></span>
            </a>
        </div>
        <p class="item-summary" th:if="${i.summary != null and !lockedIds.contains(i.id)}"
           th:text="${i.summary}">摘要</p>
        <time class="item-date" th:unless="${lockedIds.contains(i.id)}"
              th:text="${#temporals.format(i.updatedAt, 'yyyy-MM-dd')}">2026-01-01</time>
    </li>
</th:block>

<!-- 一个分类小节 + 卡片；列表页和「加载更多」的分片请求共用这一段。
     条目多的小节（subGroups 非空）在组内再分一层，二级小节默认收起。 -->
<th:block th:fragment="groupSections(groups, basePath, nextFrom)">
    <section class="item-group" th:each="g : ${groups}" th:attr="data-key=${g.title()}">
        <!-- 分类标题点一下收起 / 展开，状态记在 localStorage（内容多了以后一眼能扫） -->
        <button type="button" class="item-group-toggle" th:if="${g.title() != null}">
            <span class="item-group-caret" aria-hidden="true"></span>
            <h2 class="item-group-title" th:text="${g.title()}">分类</h2>
            <span class="item-group-count" th:text="${#lists.size(g.items())}">0</span>
        </button>
        <h2 class="item-group-title" th:unless="${g.title() != null}" th:text="${g.title()}">分类</h2>

        <th:block th:if="${g.hasSub()}">
            <section class="item-subgroup" th:each="sg : ${g.subGroups()}"
                     th:attr="data-sub=${(g.slug() == null ? '' : g.slug()) + '::' + sg.name()}">
                <button type="button" class="item-subgroup-toggle">
                    <span class="item-group-caret" aria-hidden="true"></span>
                    <h3 class="item-subgroup-title" th:text="${sg.name()}">小分类</h3>
                    <span class="item-group-count" th:text="${#lists.size(sg.items())}">0</span>
                </button>
                <ul class="item-list">
                    <th:block th:each="i : ${sg.items()}"
                              th:replace="~{fragments/list :: card(${i}, ${basePath})}"></th:block>
                </ul>
            </section>
        </th:block>

        <ul class="item-list" th:unless="${g.hasSub()}">
            <th:block th:each="i : ${g.items()}"
                      th:replace="~{fragments/list :: card(${i}, ${basePath})}"></th:block>
        </ul>
    </section>

    <!-- 滚到这里就去取下一批；取完没有下一批了就不再渲染这个点 -->
    <div class="list-more" id="list-more" th:if="${nextFrom != null and nextFrom > 0}"
         th:attr="data-base=${basePath},data-from=${nextFrom}"></div>
</th:block>

</body>
</html>
