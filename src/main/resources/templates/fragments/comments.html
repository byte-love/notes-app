<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 注释：正文里的短虚下划线、以及每处的全部注释都在这里，由 comments.js 搬进弹窗。
     这一块不占版面（hidden），页面左边是树、右边是正文。 -->
<div class="cmt-data" id="comments" hidden th:fragment="data(slug, threads, canComment)">
    <form th:if="${canComment}" class="cmt-form" hidden th:action="@{/comment/{s}(s=${slug})}" method="post">
        <input type="hidden" name="quote" value="">
        <input type="hidden" name="anchorKind" value="">
        <input type="hidden" name="blockIndex" value="">
        <input type="hidden" name="prefix" value="">
        <input type="hidden" name="suffix" value="">
        <textarea name="body" rows="4" maxlength="2000" placeholder="说点什么"></textarea>
        <div class="cmt-form-ops">
            <button type="button" class="cmt-cancel">取消</button>
            <button type="submit" class="cmt-submit">发表</button>
        </div>
    </form>
    <p class="cmt-login" th:unless="${canComment}">
        <a th:href="@{/login}">登录</a> 后可以评论
    </p>

    <section class="cmt-thread" th:each="t : ${threads}"
             th:attr="data-kind=${t.kind()},data-quote=${t.quote()},data-block=${t.blockIndex()},data-prefix=${t.prefix()},data-suffix=${t.suffix()}">
        <blockquote class="cmt-quote" th:if="${!t.quote().isEmpty()}">
            <span th:text="${t.quote()}">被注释的那段文字</span>
        </blockquote>

        <div class="cmt-card" th:each="c : ${t.comments()}" th:id="${'c' + c.id()}">
            <div class="cmt-meta">
                <span class="cmt-author" th:text="${c.author()}">某人</span>
                <time th:text="${#temporals.format(c.createdAt(), 'MM-dd HH:mm')}">01-01 00:00</time>
            </div>
            <p class="cmt-text" th:text="${c.body()}">注释内容</p>

            <div class="cmt-ops">
                <details th:if="${canComment}" class="cmt-reply">
                    <summary>回复</summary>
                    <form th:action="@{/comment/{s}(s=${slug})}" method="post">
                        <input type="hidden" name="parentId" th:value="${c.id()}">
                        <input type="hidden" name="quote" th:value="${t.quote()}">
                        <input type="hidden" name="anchorKind" th:value="${t.kind()}">
                        <input type="hidden" name="blockIndex" th:value="${t.blockIndex()}">
                        <input type="hidden" name="prefix" th:value="${t.prefix()}">
                        <input type="hidden" name="suffix" th:value="${t.suffix()}">
                        <textarea name="body" rows="2" maxlength="2000" placeholder="回复一下"></textarea>
                        <div class="cmt-form-ops">
                            <button type="submit" class="cmt-submit">发表</button>
                        </div>
                    </form>
                </details>
                <form th:if="${c.mine()}" th:action="@{/comment/{s}/{id}/delete(s=${slug},id=${c.id()})}"
                      method="post" class="inline">
                    <button type="submit" class="cmt-del">删除</button>
                </form>
            </div>

            <div class="cmt-replies" th:if="${!c.replies().isEmpty()}">
                <div class="cmt-card cmt-reply-card" th:each="r : ${c.replies()}" th:id="${'c' + r.id()}">
                    <div class="cmt-meta">
                        <span class="cmt-author" th:text="${r.author()}">某人</span>
                        <time th:text="${#temporals.format(r.createdAt(), 'MM-dd HH:mm')}">01-01 00:00</time>
                    </div>
                    <p class="cmt-text" th:text="${r.body()}">注释内容</p>
                    <div class="cmt-ops">
                        <form th:if="${r.mine()}" th:action="@{/comment/{s}/{id}/delete(s=${slug},id=${r.id()})}"
                              method="post" class="inline">
                            <button type="submit" class="cmt-del">删除</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

</body>
</html>
