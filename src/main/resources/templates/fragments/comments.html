<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 右栏评论区：整篇评论 + 锚在句子上的评论（楼中楼最多两层，回复别人的回复归到同一层） -->
<aside class="toc cmt-pane" id="comments" th:fragment="pane(slug, threads, commentCount, canComment)">
    <div class="cmt-head">
        <span class="cmt-title">评论</span>
        <span class="cmt-count" th:if="${commentCount > 0}" th:text="${commentCount}">0</span>
    </div>

    <form th:if="${canComment}" class="cmt-form" th:action="@{/comment/{s}(s=${slug})}" method="post">
        <input type="hidden" name="quote" value="">
        <textarea name="body" rows="3" maxlength="500" placeholder="说点什么"></textarea>
        <div class="cmt-form-ops">
            <button type="submit" class="cmt-submit">发表</button>
        </div>
    </form>
    <p class="cmt-login" th:unless="${canComment}">
        <a th:href="@{/login}">登录</a> 后可以评论
    </p>

    <div class="cmt-empty" th:if="${#lists.isEmpty(threads)}">还没有评论</div>

    <section class="cmt-thread" th:each="t : ${threads}" th:attr="data-quote=${t.quote()}">
        <blockquote class="cmt-quote" th:if="${!t.quote().isEmpty()}">
            <span th:text="${t.quote()}">被评论的那句话</span>
        </blockquote>

        <div class="cmt-card" th:each="c : ${t.comments()}" th:id="${'c' + c.id()}">
            <div class="cmt-meta">
                <span class="cmt-author" th:text="${c.author()}">某人</span>
                <time th:text="${#temporals.format(c.createdAt(), 'MM-dd HH:mm')}">01-01 00:00</time>
            </div>
            <p class="cmt-text" th:text="${c.body()}">评论内容</p>

            <div class="cmt-ops">
                <details th:if="${canComment}" class="cmt-reply">
                    <summary>回复</summary>
                    <form th:action="@{/comment/{s}(s=${slug})}" method="post">
                        <input type="hidden" name="parentId" th:value="${c.id()}">
                        <input type="hidden" name="quote" th:value="${t.quote()}">
                        <textarea name="body" rows="2" maxlength="500" placeholder="回复一下"></textarea>
                        <div class="cmt-form-ops">
                            <button type="submit" class="cmt-submit">发表</button>
                        </div>
                    </form>
                </details>
                <form th:if="${c.mine()}" th:action="@{/comment/{s}/{id}/delete(s=${slug},id=${c.id()})}"
                      method="post" class="inline">
                    <button type="submit" class="cmt-del">删除</button>
                </form>
            </div>

            <div class="cmt-replies" th:if="${!c.replies().isEmpty()}">
                <div class="cmt-card cmt-reply-card" th:each="r : ${c.replies()}" th:id="${'c' + r.id()}">
                    <div class="cmt-meta">
                        <span class="cmt-author" th:text="${r.author()}">某人</span>
                        <time th:text="${#temporals.format(r.createdAt(), 'MM-dd HH:mm')}">01-01 00:00</time>
                    </div>
                    <p class="cmt-text" th:text="${r.body()}">回复内容</p>
                    <div class="cmt-ops">
                        <form th:if="${r.mine()}" th:action="@{/comment/{s}/{id}/delete(s=${slug},id=${r.id()})}"
                              method="post" class="inline">
                            <button type="submit" class="cmt-del">删除</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</aside>

</body>
</html>
