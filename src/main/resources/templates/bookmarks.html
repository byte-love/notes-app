<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('书签 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap">
    <a th:replace="~{fragments/layout :: back(@{/me})}"></a>

    <div class="section-head">
        <h1>书签</h1>
        <span class="count" th:text="${#lists.size(items)} + ' 处'">0 处</span>
    </div>

    <ul class="item-list" th:if="${!#lists.isEmpty(items)}">
        <li th:each="i, st : ${items}">
            <div class="item-main">
                <a class="item-title"
                   th:href="${basePathOf.apply(i.kind) + '/' + i.slug
                        + (anchors[st.index] != '' ? '#' + anchors[st.index]
                           : (progresses[st.index] != '' ? '#pos=' + progresses[st.index] : ''))}"
                   th:text="${i.title}">标题</a>
                <span class="cl-chip" th:if="${anchors[st.index] != ''}" th:text="${'#' + anchors[st.index]}">#位置</span>
                <span class="cl-chip" th:if="${anchors[st.index] == '' and progressLabels[st.index] != ''}"
                      th:text="${progressLabels[st.index]}">50%</span>
            </div>
        </li>
    </ul>

    <p class="empty" th:if="${#lists.isEmpty(items)}">还没有书签，在正文的标题右侧点书签按钮就能标一处</p>
</main>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
