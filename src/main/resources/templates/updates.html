<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('更新 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap">
    <div class="section-head">
        <h1>更新</h1>
    </div>

    <form sec:authorize="isAuthenticated()" th:action="@{/updates/log}" method="post" class="log-form">
        <textarea name="body" rows="3" placeholder="今天做了什么维护，记一笔"></textarea>
        <button type="submit" class="btn-new">记一笔</button>
    </form>

    <div class="filters">
        <div class="seg">
            <a th:href="@{/updates}" th:classappend="${filterKind == null} ? 'on'">全部</a>
            <a th:href="@{/updates(kind='NOTE')}" th:classappend="${filterKind == 'NOTE'} ? 'on'">笔记</a>
            <a th:href="@{/updates(kind='BAGU')}" th:classappend="${filterKind == 'BAGU'} ? 'on'">八股</a>
            <a th:href="@{/updates(kind='ALGO')}" th:classappend="${filterKind == 'ALGO'} ? 'on'">算法</a>
            <a th:href="@{/updates(kind='PROJECT')}" th:classappend="${filterKind == 'PROJECT'} ? 'on'">项目</a>
        </div>
    </div>

    <section class="day" th:each="d : ${days}">
        <h2 class="day-label" th:text="${d.label()} + ' · ' + ${#temporals.format(d.date(), 'MM-dd')}">今天 · 10-29</h2>

        <ul class="feed">
            <li class="feed-log" th:each="l : ${d.logs()}">
                <span class="feed-tag log">维护</span>
                <div class="feed-main">
                    <p class="feed-text" th:text="${l.body()}">记录内容</p>
                    <span class="feed-who" th:text="${l.author()}">作者</span>
                </div>
            </li>

            <li th:each="a : ${d.items()}">
                <span class="feed-tag" th:classappend="${a.created()} ? 'new' : 'edit'"
                      th:text="${a.created()} ? '新增' : '更新'">新增</span>
                <div class="feed-main">
                    <a class="feed-text" th:href="@{${a.basePath() + '/' + a.slug()}}"
                       th:text="${a.title()}">标题</a>
                    <span class="feed-kind" th:text="${a.label()}">八股</span>
                </div>
            </li>
        </ul>
    </section>

    <p class="empty" th:if="${#lists.isEmpty(days)}">还没有更新记录</p>
</main>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
