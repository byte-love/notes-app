<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('设置 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap narrow settings-page">
    <h1 class="settings-title">设置</h1>

    <section class="me-section">
        <h2>外观</h2>

        <div class="me-row">
            <span class="me-label">主题</span>
            <div class="seg" data-setting="theme">
                <button type="button" data-value="dark">深色</button>
                <button type="button" data-value="light">浅色</button>
                <button type="button" data-value="sepia">护眼</button>
                <button type="button" data-value="mist">雾青</button>
                <button type="button" data-value="dusk">暖霞</button>
                <button type="button" data-value="system">跟随系统</button>
            </div>
        </div>
    </section>

    <section class="me-section">
        <h2>背景</h2>

        <div class="me-row">
            <span class="me-label">样式</span>
            <div class="seg" data-setting="bg">
                <button type="button" data-value="aurora">渐变</button>
                <button type="button" data-value="plain">素色</button>
                <button type="button" data-value="paper">纸纹</button>
                <button type="button" data-value="grid">网格</button>
            </div>
        </div>

        <div class="me-row">
            <span class="me-label">浓度</span>
            <span class="me-range">
                <input type="range" id="bgStrength" min="0" max="100" step="5" value="55">
                <b id="bgStrengthVal">55</b>
            </span>
        </div>
    </section>

    <section class="me-section">
        <h2>正文</h2>

        <div class="me-row">
            <span class="me-label">字号</span>
            <div class="seg" data-setting="read-size">
                <button type="button" data-value="sm">小</button>
                <button type="button" data-value="md">标准</button>
                <button type="button" data-value="lg">大</button>
            </div>
        </div>

        <div class="me-row">
            <span class="me-label">名词着色</span>
            <div class="seg" data-setting="terms">
                <button type="button" data-value="on">开</button>
                <button type="button" data-value="off">关</button>
            </div>
        </div>

        <div class="me-row">
            <span class="me-label">首行缩进</span>
            <div class="seg" data-setting="indent">
                <button type="button" data-value="on">开</button>
                <button type="button" data-value="off">关</button>
            </div>
        </div>
    </section>

    <section class="me-section">
        <h2>目录</h2>

        <div class="me-row">
            <span class="me-label">序号</span>
            <div class="seg" data-setting="tree-num">
                <button type="button" data-value="on">开</button>
                <button type="button" data-value="off">关</button>
            </div>
        </div>
    </section>

    <section class="me-section">
        <h2>浮动按钮</h2>

        <div class="me-row">
            <span class="me-label">AI 助手</span>
            <div class="seg" data-setting="float-assistant">
                <button type="button" data-value="on">开</button>
                <button type="button" data-value="off">关</button>
            </div>
        </div>

        <div class="me-row">
            <span class="me-label">学习计时器</span>
            <div class="seg" data-setting="float-timer">
                <button type="button" data-value="on">开</button>
                <button type="button" data-value="off">关</button>
            </div>
        </div>
    </section>

    <section class="me-section">
        <h2>番茄钟</h2>

        <div class="me-row">
            <span class="me-label">提醒</span>
            <div class="seg" data-setting="pomodoro">
                <button type="button" data-value="on">开</button>
                <button type="button" data-value="off">关</button>
            </div>
        </div>
    </section>
    <section class="me-section" th:if="${myCategories != null}">
        <h2>笔记分类</h2>

        <div class="cat-row" th:each="c, st : ${myCategories}">
            <form class="cat-name" method="post" th:action="@{/settings/categories/{id}/rename(id=${c.id})}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <input type="text" name="name" maxlength="40" th:value="${c.name}" aria-label="分类名">
                <button type="submit" class="cat-btn">改名</button>
            </form>
            <form method="post" th:action="@{/settings/categories/{id}/move(id=${c.id})}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <input type="hidden" name="dir" value="up">
                <button type="submit" class="cat-btn" th:disabled="${st.first}" aria-label="上移">↑</button>
            </form>
            <form method="post" th:action="@{/settings/categories/{id}/move(id=${c.id})}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <input type="hidden" name="dir" value="down">
                <button type="submit" class="cat-btn" th:disabled="${st.last}" aria-label="下移">↓</button>
            </form>
            <form class="cat-del" method="post"
                  th:action="@{/settings/categories/{id}/delete(id=${c.id})}"
                  th:attr="data-name=${c.name},data-count=${catCounts.get(c.id) == null ? 0 : catCounts.get(c.id)}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <button type="submit" class="cat-btn cat-btn-del">删除</button>
            </form>
        </div>

        <form class="cat-row cat-new" method="post" th:action="@{/settings/categories}">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <input type="text" name="name" maxlength="40" placeholder="新分类" aria-label="新分类名">
            <button type="submit" class="cat-btn">新建</button>
        </form>
    </section>
</main>

<script>
    (() => {
        const root = document.documentElement;
        const mq = window.matchMedia('(prefers-color-scheme: dark)');

        const read = (key) => {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        };
        const write = (key, value) => {
            try { localStorage.setItem(key, value); } catch (e) {}
        };

        const applyTheme = (value) => {
            if (value === 'system') {
                delete root.dataset.theme;
            } else {
                root.dataset.theme = value;
            }
        };

        const applySize = (value) => {
            root.dataset.readSize = value;
        };

        const applyBg = (value) => {
            if (value === 'paper' || value === 'grid' || value === 'aurora') {
                root.dataset.bg = value;
            } else {
                delete root.dataset.bg;
            }
        };

        const applyTerms = (value) => {
            if (value === 'off') {
                root.dataset.terms = 'off';
            } else {
                delete root.dataset.terms;
            }
        };

        const applyIndent = (value) => {
            if (value === 'off') {
                root.dataset.indent = 'off';
            } else {
                delete root.dataset.indent;
            }
        };

        const applyTreeNum = (value) => {
            if (value === 'off') {
                root.dataset.treeNum = 'off';
            } else {
                delete root.dataset.treeNum;
            }
        };

        const DEFAULTS = { theme: 'dark', 'read-size': 'md', bg: 'aurora', terms: 'on', indent: 'on', 'tree-num': 'on', pomodoro: 'on', 'float-assistant': 'on', 'float-timer': 'on' };
        const userName = (document.querySelector('meta[name="user-name"]') || {}).content || '';

        const mark = (group, value) => {
            group.querySelectorAll('button').forEach((b) => {
                b.classList.toggle('on', b.dataset.value === value);
            });
        };

        document.querySelectorAll('.seg[data-setting]').forEach((group) => {
            const key = group.dataset.setting;
            const storeKey = key === 'pomodoro' ? 'pomodoro:' + userName : key;
            mark(group, read(storeKey) || DEFAULTS[key]);

            group.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-value]');
                if (!btn) return;
                const value = btn.dataset.value;
                write(storeKey, value);
                if (key === 'theme') {
                    applyTheme(value);
                } else if (key === 'read-size') {
                    applySize(value);
                } else if (key === 'bg') {
                    applyBg(value);
                } else if (key === 'terms') {
                    applyTerms(value);
                } else if (key === 'indent') {
                    applyIndent(value);
                } else if (key === 'tree-num') {
                    applyTreeNum(value);
                } else if (key === 'float-assistant' || key === 'float-timer') {
                    if (window.Float) {
                        window.Float.setHidden(key === 'float-assistant' ? 'assistant' : 'timer', value === 'off');
                    }
                }
                mark(group, value);
            });
        });

        // 浮球的键是 Float 在管（float:assistant / float:timer），defer 脚本在 inline 之后才跑，
        // 所以等 load 再按真实状态回填一次
        window.addEventListener('load', () => {
            document.querySelectorAll('.seg[data-setting^="float-"]').forEach((group) => {
                const id = group.dataset.setting === 'float-assistant' ? 'assistant' : 'timer';
                if (window.Float) mark(group, window.Float.isHidden(id) ? 'off' : 'on');
            });
        });

        // 背景浓度：直接改 html 上的 --tex，CSS 里各种纹理都按它算透明度
        const strength = document.getElementById('bgStrength');
        const strengthVal = document.getElementById('bgStrengthVal');
        if (strength) {
            const saved = read('bg-strength');
            if (saved) {
                strength.value = saved;
            }
            strengthVal.textContent = strength.value;
            root.style.setProperty('--tex', strength.value);
            strength.addEventListener('input', () => {
                strengthVal.textContent = strength.value;
                root.style.setProperty('--tex', strength.value);
                write('bg-strength', strength.value);
            });
        }

        // 选「跟随系统」时，系统主题变了要立刻反映
        mq.addEventListener('change', () => {
            if ((read('theme') || 'system') === 'system') applyTheme('system');
        });

        // 删分类：先说清楚里面有多少篇、删完它们去哪
        document.querySelectorAll('form.cat-del').forEach((form) => {
            form.addEventListener('submit', async (e) => {
                if (form.dataset.ok === '1') return;
                e.preventDefault();
                const ask = '删除「' + form.dataset.name + '」？里面的 ' + (form.dataset.count || '0')
                    + ' 篇会移到「未分类」。';
                const ok = window.uiConfirm ? await window.uiConfirm(ask) : window.confirm(ask);
                if (!ok) return;
                form.dataset.ok = '1';
                form.submit();
            });
        });
    })();
</script>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
