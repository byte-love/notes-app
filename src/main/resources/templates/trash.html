<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('回收站 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="wrap wide">
    <a th:href="@{/me}" class="back-link">返回</a>

    <div class="section-head">
        <h1>回收站</h1>
        <span class="count" th:text="${#lists.size(items)} + ' 条'">0 条</span>
    </div>

    <p class="notice">
        删掉的内容会在这里保留 <span th:text="${keepDays}">30</span> 天，这段时间里可以随时恢复；
        超过之后会被自动彻底删除，找不回来。
    </p>

    <div class="table-scroll" th:if="${!#lists.isEmpty(items)}">
        <table class="admin-table">
            <thead>
            <tr>
                <th>类型</th>
                <th>标题</th>
                <th>删除时间</th>
                <th>还能恢复</th>
                <th class="actions">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${items}">
                <td th:text="${i.kindLabel()}">笔记</td>
                <td class="cell-title" th:text="${i.title()}">标题</td>
                <td th:text="${#temporals.format(i.deletedAt(), 'yyyy-MM-dd HH:mm')}">2026-10-29 10:36</td>
                <td th:text="${i.daysLeft()} + ' 天'">30 天</td>
                <td class="actions">
                    <div class="row-actions">
                        <form th:action="@{/trash/{id}/restore(id=${i.id()})}" method="post" class="inline">
                            <button type="submit" class="link-button">恢复</button>
                        </form>
                        <form th:action="@{/trash/{id}/purge(id=${i.id()})}" method="post" class="inline"
                              onsubmit="return confirm('彻底删除之后无法恢复，确认？');">
                            <button type="submit" class="link-button danger">彻底删除</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(items)}">回收站是空的</p>
</main>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
