<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('登录 · byte-love')}"></head>
<body class="login-body">
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="login-main">
    <div class="login-card">
        <h1>登录</h1>

        <form th:action="@{/login}" method="post" class="stack">
            <label>
                用户名
                <input type="text" name="username" autocomplete="username" required autofocus>
            </label>
            <label>
                密码
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <p class="error" th:if="${error}">账号或密码错误，或账号已被临时锁定</p>
            <button type="submit">登录</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
