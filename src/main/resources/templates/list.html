<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('笔记 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<div class="with-tree">
    <aside class="tree-pane">
        <ul th:if="${!#lists.isEmpty(items)}" th:replace="~{fragments/tree :: nodes(${tree})}"></ul>
        <p class="empty" th:if="${#lists.isEmpty(items)}">暂无内容</p>
    </aside>

    <main class="tree-main">
        <div class="page-head">
            <h1 th:text="${pageTitle}">笔记</h1>
            <span class="count" th:text="${#lists.size(items)} + ' 篇'">0 篇</span>
        </div>

        <p class="tree-hint" th:if="${lockedCount > 0}">
            登录后可查看其余 <span th:text="${lockedCount}">0</span> 篇
        </p>

        <ul class="item-list">
            <li th:each="i : ${items}">
                <div class="item-main">
                    <a th:unless="${lockedIds.contains(i.id)}" class="item-title"
                       th:href="${basePath + '/' + i.slug}" th:text="${i.title}">标题</a>
                    <a th:if="${lockedIds.contains(i.id)}" class="item-title locked"
                       th:href="@{/login}" title="需要登录后查看">
                        <span th:text="${i.title}"></span>
                    </a>
                </div>
                <p class="item-summary" th:if="${i.summary != null and !lockedIds.contains(i.id)}"
                   th:text="${i.summary}">摘要</p>
                <time class="item-date" th:unless="${lockedIds.contains(i.id)}"
                      th:text="${#temporals.format(i.updatedAt, 'yyyy-MM-dd')}">2026-01-01</time>
            </li>
        </ul>
    </main>
</div>

<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
