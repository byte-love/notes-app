<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head(${pageTitle + ' · byte-love'})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<div class="with-tree" th:classappend="${#lists.isEmpty(tree)} ? 'no-tree' : ''">
    <aside class="tree-pane" th:attr="data-kind=${#strings.toLowerCase(kind.name())}" th:if="${!#lists.isEmpty(tree)}">
        <div class="tree-head">
            <span class="tree-head-text">我的目录</span>
            <button sec:authorize="isAuthenticated()" type="button" class="tree-act tree-add"
                    data-parent="" aria-label="在最外层新建">+</button>
        </div>
        <ul th:replace="~{fragments/tree :: nodes(${tree})}"></ul>
    </aside>

    <main class="tree-main">
        <div class="page-head">
            <nav th:replace="~{fragments/layout :: mineTabs}"></nav>
            <span class="count" th:text="${#lists.size(items)} + ' 篇'">0 篇</span>
        </div>

        <p class="last-read" th:if="${lastRead != null}">
            上次看到 · <a th:href="${basePath + '/' + lastRead.slug}" th:text="${lastRead.title}">标题</a>
        </p>

        <p class="tree-hint" th:if="${lockedCount > 0}">
            登录后可查看其余 <span th:text="${lockedCount}">0</span> 篇
        </p>

        <p class="empty" th:if="${#lists.isEmpty(tree)}">暂无内容</p>

        <!-- 星级 / 收藏筛选：只换屏幕上的卡片，左边目录照旧整棵；条数为 0 的那档置灰点不动。
             带着标签筛的时候，切星级要保留标签，反过来也一样 -->
        <th:block th:with="tq=${tagFilter != null ? '&tag=' + tagFilter : ''}">
        <nav class="rate-filter" th:if="${rateCounts != null}">
            <a class="rate-chip"
               th:classappend="${rateFilter == null ? 'on' : (rateCounts['all'] == 0 ? 'off' : '')}"
               th:href="${basePath + (tagFilter != null ? '?tag=' + tagFilter : '')}">全部<span
                    class="rate-chip-count" th:text="${rateCounts['all']}">0</span></a>
            <a class="rate-chip"
               th:classappend="${rateFilter == 'star' ? 'on' : (rateCounts['star'] == 0 ? 'off' : '')}"
               th:href="${basePath + '?rate=star' + tq}">收藏<span class="rate-chip-count"
                    th:text="${rateCounts['star']}">0</span></a>
            <a class="rate-chip"
               th:classappend="${rateFilter == '3' ? 'on' : (rateCounts['3'] == 0 ? 'off' : '')}"
               th:href="${basePath + '?rate=3' + tq}">★★★<span class="rate-chip-count"
                    th:text="${rateCounts['3']}">0</span></a>
            <a class="rate-chip"
               th:classappend="${rateFilter == '2' ? 'on' : (rateCounts['2'] == 0 ? 'off' : '')}"
               th:href="${basePath + '?rate=2' + tq}">★★以上<span class="rate-chip-count"
                    th:text="${rateCounts['2']}">0</span></a>
            <a class="rate-chip"
               th:classappend="${rateFilter == '0' ? 'on' : (rateCounts['0'] == 0 ? 'off' : '')}"
               th:href="${basePath + '?rate=0' + tq}">未评<span class="rate-chip-count"
                    th:text="${rateCounts['0']}">0</span></a>
        </nav>

        <!-- 标签筛选：按现在这批内容的自动标签排，条数跟当前星级筛选取交集 -->
        <nav class="rate-filter tag-filter" th:if="${tagCounts != null and !tagCounts.isEmpty()}">
            <a class="rate-chip"
               th:classappend="${tagFilter == null} ? 'on'"
               th:href="${basePath + (rateFilter != null ? '?rate=' + rateFilter : '')}">全部标签</a>
            <a class="rate-chip" th:each="e : ${tagCounts}"
               th:classappend="${tagFilter == e.key} ? 'on'"
               th:href="${basePath + '?tag=' + e.key + (rateFilter != null ? '&rate=' + rateFilter : '')}">
                <span th:text="${e.key}">Redis</span><span class="rate-chip-count"
                    th:text="${e.value}">0</span>
            </a>
        </nav>
        </th:block>

        <!-- 分组外层：收起的分组在这里并排成卡片网格，展开的那组占满整行 -->
        <div class="group-grid">
            <th:block th:replace="~{fragments/list :: groupSections(${groups}, ${basePath}, ${nextFrom})}"/>
        </div>
    </main>
</div>

<script th:src="@{/js/list.js(v=8)}" defer></script>
<script th:src="@{/js/rate.js(v=2)}" defer></script>
<script th:src="@{/js/tree-admin.js(v=2)}" defer></script>
<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
