<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('笔记 · byte-love')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<div class="with-tree" th:classappend="${#lists.isEmpty(tree)} ? 'no-tree' : ''">
    <aside class="tree-pane" th:if="${!#lists.isEmpty(tree)}">
        <ul th:replace="~{fragments/tree :: nodes(${tree})}"></ul>
    </aside>

    <main class="tree-main">
        <div class="page-head">
            <h1 th:text="${pageTitle}">笔记</h1>
            <span class="count" th:text="${#lists.size(items)} + ' 篇'">0 篇</span>
        </div>

        <p class="last-read" th:if="${lastRead != null}">
            上次看到 · <a th:href="${basePath + '/' + lastRead.slug}" th:text="${lastRead.title}">标题</a>
        </p>

        <p class="tree-hint" th:if="${lockedCount > 0}">
            登录后可查看其余 <span th:text="${lockedCount}">0</span> 篇
        </p>

        <p class="empty" th:if="${#lists.isEmpty(tree)}">暂无内容</p>

        <th:block th:replace="~{fragments/list :: groupSections(${groups}, ${basePath}, ${nextFrom})}"/>
    </main>
</div>

<script th:src="@{/js/list.js(v=3)}" defer></script>
<footer th:replace="~{fragments/layout :: foot}"></footer>
</body>
</html>
