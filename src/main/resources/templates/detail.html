<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head(${item.title + ' · byte-love'})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<div class="with-tree" th:classappend="${item.kind.name() != 'PROJECT'} ? 'has-tree' : ''">
    <aside class="tree-pane" th:if="${item.kind.name() != 'PROJECT' and tree != null}">
        <p class="tree-hint" th:if="${lockedCount > 0}">
            登录后可查看其余 <span th:text="${lockedCount}">0</span> 篇
        </p>
        <ul th:replace="~{fragments/tree :: nodes(${tree})}"></ul>
    </aside>

    <main class="doc-wrap" th:classappend="${#lists.isEmpty(toc)} ? 'no-toc'">
        <article class="doc">
            <a class="back-link" th:href="${basePath}" onclick="if (history.length > 1) { history.back(); return false; }">返回</a>

            <nav class="crumbs" th:if="${crumbs != null and #lists.size(crumbs) > 1}">
                <a th:each="c, s : ${crumbs}"
                   th:href="${basePath + '/' + c.slug}"
                   th:text="${c.title}"
                   th:classappend="${s.last} ? 'here'"></a>
            </nav>

            <header class="doc-head">
                <h1 th:text="${item.title}">标题</h1>
                <div class="doc-meta">
                    <time th:text="${#temporals.format(item.updatedAt, 'yyyy-MM-dd')}">2026-01-01</time>
                    <form sec:authorize="isAuthenticated()" th:action="@{/star/{s}(s=${item.slug})}"
                          method="post" class="inline">
                        <button type="submit" class="star-btn" th:classappend="${starred} ? 'on'"
                                th:text="${starred} ? '★ 已收藏' : '☆ 收藏'">☆ 收藏</button>
                    </form>
                    <form sec:authorize="isAuthenticated()" th:action="@{/bookmark/{s}(s=${item.slug})}"
                          method="post" class="inline">
                        <button type="submit" class="star-btn"
                                th:classappend="${bookmarked} ? 'on'"
                                th:text="${bookmarked} ? '已加书签' : '加书签'">加书签</button>
                    </form>
                </div>
            </header>

            <div class="markdown" th:utext="${html}" th:attr="data-slug=${item.slug},data-anchors=${bookmarkAnchorCsv}"></div>
        </article>

        <aside class="toc" th:if="${!#lists.isEmpty(toc)}">
            <ul>
                <li th:each="h : ${toc}" th:class="'lv' + ${h.level()}">
                    <a th:href="'#' + ${h.id()}" th:text="${h.text()}"></a>
                </li>
            </ul>
        </aside>
    </main>
</div>

<script>
    (() => {
        const links = [...document.querySelectorAll('.toc a')];
        if (!links.length) return;
        const byId = new Map(links.map((a) => [a.getAttribute('href').slice(1), a]));
        const targets = [...byId.keys()].map((id) => document.getElementById(id)).filter(Boolean);
        if (!targets.length) return;

        const OFFSET = 96;
        let active = null;

        const setActive = (a) => {
            if (!a || a === active) return;
            if (active) active.classList.remove('on');
            active = a;
            active.classList.add('on');
        };

        const update = () => {
            if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
                setActive(byId.get(targets[targets.length - 1].id));
                return;
            }
            let current = targets[0];
            for (const t of targets) {
                if (t.getBoundingClientRect().top <= OFFSET) current = t;
                else break;
            }
            setActive(byId.get(current.id));
        };

        let ticking = false;
        const onScroll = () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                ticking = false;
                update();
            });
        };

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        update();
    })();
</script>

<script>
    (() => {
        const marks = document.querySelectorAll('.markdown [data-tip]');
        if (!marks.length) return;

        const tip = document.createElement('div');
        tip.className = 'gl-tip';
        document.body.appendChild(tip);

        let current = null;

        const show = (el) => {
            current = el;
            tip.textContent = el.getAttribute('data-tip');
            tip.style.left = '0px';
            tip.style.top = '0px';
            tip.classList.add('on');

            const r = el.getBoundingClientRect();
            const tw = tip.offsetWidth;
            const th = tip.offsetHeight;
            let left = r.left + r.width / 2 - tw / 2;
            left = Math.max(12, Math.min(left, window.innerWidth - tw - 12));
            let top = r.bottom + 8;
            if (top + th > window.innerHeight - 12) top = r.top - th - 8;
            tip.style.left = Math.round(left) + 'px';
            tip.style.top = Math.round(Math.max(12, top)) + 'px';
        };

        const hide = () => {
            current = null;
            tip.classList.remove('on');
        };

        const pick = (target) => (target.closest ? target.closest('.markdown [data-tip]') : null);

        document.addEventListener('mouseover', (e) => {
            const el = pick(e.target);
            if (el) {
                if (el !== current) show(el);
            } else if (current) {
                hide();
            }
        });

        document.addEventListener('mouseout', (e) => {
            const el = pick(e.target);
            if (el && el === current && !el.contains(e.relatedTarget)) hide();
        });

        document.addEventListener('click', (e) => {
            const el = pick(e.target);
            if (el) show(el);
            else hide();
        });

        window.addEventListener('scroll', hide, { passive: true });
        window.addEventListener('resize', hide);
    })();
</script>

<footer th:replace="~{fragments/layout :: foot}"></footer>

<script>
    // 每个正文标题右边挂一个书签按钮，点一下把位置记下来；下次从「书签」页直接跳回来
    (() => {
        const box = document.querySelector('.markdown[data-slug]');
        if (!box) return;
        const token = document.querySelector('meta[name="_csrf"]')?.content;
        if (!token) return;

        const slug = box.dataset.slug;
        const mine = new Set((box.dataset.anchors || '').split(',').filter(Boolean));
        const heads = [...box.querySelectorAll('h2[id], h3[id]')];
        if (!heads.length) return;

        heads.forEach((h) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'head-bookmark' + (mine.has(h.id) ? ' on' : '');
            btn.title = mine.has(h.id) ? '已在此加书签' : '在这一块加书签';
            btn.setAttribute('aria-label', btn.title);
            btn.addEventListener('click', async (e) => {
                e.preventDefault();
                btn.disabled = true;
                try {
                    await fetch(`/app/bookmark/${encodeURIComponent(slug)}?anchor=${encodeURIComponent(h.id)}`, {
                        method: 'POST',
                        headers: { 'X-CSRF-TOKEN': token },
                        credentials: 'same-origin',
                    });
                    btn.classList.toggle('on');
                    btn.title = btn.classList.contains('on') ? '已在此加书签' : '在这一块加书签';
                } catch (err) {
                    /* 失败就不改状态 */
                } finally {
                    btn.disabled = false;
                }
            });
            h.appendChild(btn);
        });
    })();
</script>

<script>
    // 左右两栏可以拖拽调宽（左：目录树，右：本页目录），宽度记在 localStorage
    (() => {
        const wrap = document.querySelector('.with-tree.has-tree');
        if (!wrap) return;
        const tree = wrap.querySelector('.tree-pane');
        const docWrap = wrap.querySelector('.doc-wrap');
        const toc = docWrap ? docWrap.querySelector('.toc') : null;

        const MIN_TREE = 150, MAX_TREE = 420;
        const MIN_TOC = 130, MAX_TOC = 380;

        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
        const read = (k) => {
            try { return parseInt(localStorage.getItem(k), 10); } catch (e) { return NaN; }
        };
        const save = (k, v) => {
            try { localStorage.setItem(k, String(v)); } catch (e) {}
        };

        let treeW = read('layout:tree');
        if (isNaN(treeW)) treeW = tree.getBoundingClientRect().width;
        let tocW = toc ? read('layout:toc') : NaN;
        if (toc && isNaN(tocW)) tocW = toc.getBoundingClientRect().width;

        const applyTree = () => {
            wrap.style.setProperty('--tree-w', clamp(treeW, MIN_TREE, MAX_TREE) + 'px');
        };
        const applyToc = () => {
            if (!toc) return;
            docWrap.style.gridTemplateColumns = 'minmax(0, 1fr) ' + clamp(tocW, MIN_TOC, MAX_TOC) + 'px';
        };

        applyTree();
        applyToc();

        const makeSplitter = (host, onMove, onDone) => {
            const bar = document.createElement('div');
            bar.className = 'splitter';
            host.appendChild(bar);

            let startX = 0;
            const down = (e) => {
                startX = e.touches ? e.touches[0].clientX : e.clientX;
                bar.classList.add('dragging');
                const move = (ev) => {
                    const x = ev.touches ? ev.touches[0].clientX : ev.clientX;
                    onMove(x - startX);
                    startX = x;
                    layout();
                    if (ev.cancelable) ev.preventDefault();
                };
                const up = () => {
                    bar.classList.remove('dragging');
                    document.removeEventListener('mousemove', move);
                    document.removeEventListener('mouseup', up);
                    document.removeEventListener('touchmove', move);
                    document.removeEventListener('touchend', up);
                    onDone();
                    layout();
                };
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', up);
                document.addEventListener('touchmove', move, { passive: false });
                document.addEventListener('touchend', up);
                e.preventDefault();
            };
            bar.addEventListener('mousedown', down);
            bar.addEventListener('touchstart', down, { passive: false });
            return bar;
        };

        // 左边：贴着树目录的右边缘
        const leftBar = makeSplitter(wrap, (dx) => {
            treeW = clamp(treeW + dx, MIN_TREE, MAX_TREE);
            applyTree();
        }, () => save('layout:tree', Math.round(treeW)));   // layout() 在 makeSplitter 的 move 里已调

        // 右边：贴着本页目录的左边缘
        let rightBar = null;
        if (toc) {
            rightBar = makeSplitter(docWrap, (dx) => {
                tocW = clamp(tocW - dx, MIN_TOC, MAX_TOC);
                applyToc();
            }, () => save('layout:toc', Math.round(tocW)));
        }

        // 把两条分隔条放到两栏的缝上
        function layout() {
            const wr = wrap.getBoundingClientRect();
            const tr = tree.getBoundingClientRect();
            leftBar.style.left = (tr.right - wr.left) + 'px';

            if (rightBar && toc) {
                const dr = docWrap.getBoundingClientRect();
                const rr = toc.getBoundingClientRect();
                rightBar.style.left = (rr.left - dr.left) + 'px';
            }
        }

        layout();
        window.addEventListener('resize', layout);
    })();
</script>
</body>
</html>
