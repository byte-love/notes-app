<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head(${item.title + ' · byte-love'})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<div class="with-tree" th:classappend="${item.kind.name() != 'PROJECT'} ? 'has-tree' : ''"
     th:attr="data-area=${#strings.toLowerCase(item.kind.name())}">
    <aside class="tree-pane" th:attr="data-kind=${#strings.toLowerCase(item.kind.name())}" th:if="${item.kind.name() != 'PROJECT' and tree != null}">
        <p class="tree-hint" th:if="${lockedCount > 0}">
            登录后可查看其余 <span th:text="${lockedCount}">0</span> 篇
        </p>
        <div class="tree-head">
            <span class="tree-head-text">我的目录</span>
            <button sec:authorize="isAuthenticated()" type="button" class="tree-act tree-add"
                    data-parent="" aria-label="在最外层新建">+</button>
        </div>
        <ul th:replace="~{fragments/tree :: nodes(${tree})}"></ul>
    </aside>

    <main class="doc-wrap">
        <!-- data-prev / data-next 只给键盘左右键用，页面上不出现「上一篇」按钮 -->
        <article class="doc"
                 th:attr="data-prev=${prevNote != null} ? ${basePath + '/' + prevNote.slug} : null,
                          data-next=${nextNote != null} ? ${basePath + '/' + nextNote.slug} : null">
            <a th:replace="~{fragments/layout :: back(${basePath})}"></a>

            <nav class="crumbs" th:if="${crumbs != null and #lists.size(crumbs) > 1}">
                <a th:each="c, s : ${crumbs}"
                   th:href="${basePath + '/' + c.slug}"
                   th:text="${c.title}"
                   th:classappend="${s.last} ? 'here'"></a>
            </nav>

            <header class="doc-head">
                <h1 th:text="${item.title}" th:attr="contenteditable=${canRate == true} ? 'true' : null, data-item-id=${canRate == true} ? ${item.id} : null">标题</h1>
                <div class="doc-meta">
                    <th:block th:replace="~{fragments/rate :: stars(${item.slug}, ${item.rating}, ${canRate == true})}"></th:block>
                    <time th:text="${#temporals.format(item.updatedAt, 'yyyy-MM-dd')}">2026-01-01</time>
                    <form sec:authorize="isAuthenticated()" th:action="@{/star/{s}(s=${item.slug})}"
                          method="post" class="inline">
                        <button type="submit" class="star-btn" th:classappend="${starred} ? 'on'"
                                th:text="${starred} ? '★ 已收藏' : '☆ 收藏'">☆ 收藏</button>
                    </form>
                    <form sec:authorize="isAuthenticated()" th:action="@{/bookmark/{s}(s=${item.slug})}"
                          method="post" class="inline">
                        <button type="submit" class="star-btn"
                                th:classappend="${bookmarked} ? 'on'"
                                th:text="${bookmarked} ? '已加书签' : '加书签'">加书签</button>
                    </form>
                    <!-- 自己的内容：正文直接可改（点进去打字，停手自动存）；
                         超大文档降级成「编辑」按钮 + 源码框；可见性 / 上级目录走左树「⋯」里的「编辑」 -->
                    <button th:if="${canRate == true and item.body != null and #strings.length(item.body) > 65536}"
                            type="button" class="star-btn" id="body-edit">编辑</button>
                    <button th:if="${canRate == true}" type="button" class="star-btn" data-act="supplement">插入笔记卡片</button>
                </div>
            </header>

            <!-- 超长正文的降级编辑（正常情况用不到，正文本身就是可编辑的） -->
            <div class="body-editor" id="body-editor" hidden
                 th:if="${canRate == true and item.body != null and #strings.length(item.body) > 65536}"
                 th:attr="data-save=@{/admin/{id}/body(id=${item.id})}">
                <textarea class="body-source" spellcheck="false" th:text="${item.body}"></textarea>
                <div class="body-editor-actions">
                    <button type="button" class="btn-primary" data-act="save">保存</button>
                    <button type="button" class="btn-ghost" data-act="cancel">取消</button>
                </div>
            </div>

            <!-- 插入笔记卡片：正文末尾那张附件卡，标题 + 一段正文 -->
            <form class="supp-form" id="supp-form" hidden th:if="${canRate == true}"
                  th:action="@{/admin/{id}/supplement(id=${item.id})}" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <input type="text" name="supplementTitle" placeholder="卡片标题，留空取正文第一行">
                <textarea name="supplementBody" rows="8" placeholder="卡片正文（Markdown）"></textarea>
                <div class="supp-form-actions">
                    <button type="submit" class="btn-primary">挂上</button>
                    <button type="button" class="btn-ghost" data-act="supplement-cancel">取消</button>
                </div>
            </form>

            <!-- 自动打的标签：点一下就是把列表按这个标签筛一遍；颜色按词固定，不随机 -->
            <p class="doc-tags" th:if="${itemTags != null and !#lists.isEmpty(itemTags)}">
                <a class="doc-tag" th:each="t : ${itemTags}" th:href="${basePath + '?tag=' + t}"
                   th:attr="data-tone=${tagTone.of(t)}" th:text="${t}">标签</a>
            </p>

            <!-- 这条是补充笔记时，标题下面指出「本体」是哪一篇，点一下回去 -->
            <p class="doc-origin" th:if="${parentNote != null}">
                <span class="doc-origin-label">本体</span>
                <a th:href="${basePath + '/' + parentNote.slug()}" th:text="${parentNote.title()}">标题</a>
            </p>

            <div class="markdown" th:utext="${html}"
                 th:attr="data-slug=${item.slug},data-anchors=${bookmarkAnchorCsv},data-resume=${resumeProgress},
                          data-save=${canRate == true} ? @{/admin/{id}/body(id=${item.id})} : null,
                          data-upload=${canRate == true} ? @{/admin/upload} : null,
                          contenteditable=${canRate == true and item.body != null and #strings.length(item.body) <= 65536} ? 'true' : null"></div>

            <!-- 正文末尾挂的补充笔记：像附件卡一样列出来，点开就是那篇；右边给个删除 -->
            <section class="attach-list" th:if="${attachedNotes != null and !#lists.isEmpty(attachedNotes)}">
                <div class="attach-item" th:each="n : ${attachedNotes}">
                    <a class="attach-card" th:href="${basePath + '/' + n.slug()}">
                        <span class="attach-icon" aria-hidden="true">&lt;/&gt;</span>
                        <span class="attach-main">
                            <span class="attach-title" th:text="${n.title()}">补充笔记</span>
                            <span class="attach-size" th:text="${n.size()}">9.1 KB</span>
                        </span>
                        <span class="attach-eye" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1.9 12S5.6 5.6 12 5.6 22.1 12 22.1 12 18.4 18.4 12 18.4 1.9 12 1.9 12Z"/>
                                <circle cx="12" cy="12" r="3.1"/>
                            </svg>
                        </span>
                    </a>
                    <form th:if="${canRate == true}" th:action="@{/admin/{id}/supplement/delete(id=${item.id})}"
                          method="post" class="attach-del"
                          data-confirm="删掉这张笔记卡片？它本身会进回收站，30 天内能恢复。">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <button type="submit" class="attach-del-btn" title="删掉这张卡片">×</button>
                    </form>
                </div>
            </section>

            <!-- 同一分类里的下一篇；到底了就给个明确的终点，免得人以为还有 -->
            <nav class="doc-next" th:if="${nextNote != null}">
                <a class="doc-next-link" th:href="${basePath + '/' + nextNote.slug}">
                    <span class="doc-next-label">下一篇</span>
                    <span class="doc-next-title" th:text="${nextNote.title}">标题</span>
                    <span class="doc-next-arrow" aria-hidden="true">→</span>
                </a>
            </nav>
            <p class="doc-next-end" th:if="${nextNote == null}">已经是这个分类的最后一篇</p>
        </article>

        <!-- 右栏是评论区：整篇评论 + 对正文里带下划线句子的评论 -->
        <aside th:replace="~{fragments/comments :: pane(${commentSlug}, ${threads}, ${commentCount}, ${canComment})}"></aside>
    </main>

    <!-- 评论区的展开 / 收起：收起后只在右上角留这个图标 -->
    <button type="button" class="cmt-toggle" id="cmt-toggle" aria-label="收起评论" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.6a2 2 0 0 1-2 2H8.2l-4.2 3.2V5.4a2 2 0 0 1 2-2h12.5a2 2 0 0 1 2 2Z"/>
            <path d="M8.6 9.6h6.8"/>
        </svg>
    </button>
</div>

<!-- 注释的数据和输入框（不占版面），正文里的短虚下划线由 comments.js 读这一块画出来 -->
<div th:replace="~{fragments/annotations :: data(${commentSlug}, ${annotations}, ${canComment})}"></div>

<!-- 重点高亮的数据（不占版面），正文里的彩色底纹由 comments.js 画出来 -->
<div th:replace="~{fragments/highlights :: data(${commentSlug}, ${highlights})}"></div>

    <script th:src="@{/js/comments.js(v=22)}"></script>
    <script th:src="@{/js/code.js(v=4)}"></script>
    <script th:src="@{/js/detail.js(v=15)}"></script>
    <script th:src="@{/js/rate.js(v=3)}"></script>
<script th:src="@{/js/tree-admin.js(v=4)}"></script>
<script th:src="@{/js/body-edit.js(v=3)}"></script>
<script th:src="@{/js/doc-edit.js(v=14)}"></script>

<footer th:replace="~{fragments/layout :: foot}"></footer>

</body>
</html>
