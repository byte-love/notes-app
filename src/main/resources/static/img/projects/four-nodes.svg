<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="申报生成链路：取数、生成、校验、回填四个节点">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#484f58"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="299" rx="12" fill="#0d1117" stroke="#30363d"/>
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- 节点 -->
    <g>
      <rect x="20" y="80" width="140" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="90" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#c9d1d9">取数</text>
      <text x="90" y="126" text-anchor="middle" font-size="11" fill="#8b949e">Spring Boot 接口</text>
    </g>
    <g>
      <rect x="200" y="80" width="140" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="270" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#c9d1d9">生成</text>
      <text x="270" y="126" text-anchor="middle" font-size="11" fill="#8b949e">模型写 300 字简介</text>
    </g>
    <g>
      <rect x="380" y="80" width="140" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="450" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#c9d1d9">校验</text>
      <text x="450" y="126" text-anchor="middle" font-size="11" fill="#8b949e">schema / 空值 / 兜底</text>
    </g>
    <g>
      <rect x="560" y="80" width="140" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="630" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#c9d1d9">回填</text>
      <text x="630" y="126" text-anchor="middle" font-size="11" fill="#8b949e">按行写回表格</text>
    </g>

    <!-- 主链路箭头 -->
    <line x1="160" y1="112" x2="196" y2="112" stroke="#484f58" stroke-width="1.4" marker-end="url(#ar)"/>
    <line x1="340" y1="112" x2="376" y2="112" stroke="#484f58" stroke-width="1.4" marker-end="url(#ar)"/>
    <line x1="520" y1="112" x2="556" y2="112" stroke="#484f58" stroke-width="1.4" marker-end="url(#ar)"/>

    <!-- checkpoint 标注 -->
    <circle cx="178" cy="112" r="2.6" fill="#3fb950"/>
    <circle cx="358" cy="112" r="2.6" fill="#3fb950"/>
    <circle cx="538" cy="112" r="2.6" fill="#3fb950"/>
    <text x="178" y="170" text-anchor="middle" font-size="10" fill="#8b949e">checkpoint</text>
    <text x="358" y="170" text-anchor="middle" font-size="10" fill="#8b949e">checkpoint</text>
    <text x="538" y="170" text-anchor="middle" font-size="10" fill="#8b949e">checkpoint</text>

    <!-- 校验失败：自修复一次，回到生成 -->
    <path d="M450 80 V40 H270 V76" fill="none" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#ar-blue)"/>
    <text x="360" y="30" text-anchor="middle" font-size="11" fill="#58a6ff">解析失败：自修复一次</text>

    <!-- 仍失败：规则填充（降级），再进回填 -->
    <path d="M450 144 V192" fill="none" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#ar-blue)"/>
    <rect x="380" y="196" width="140" height="58" rx="10" fill="#161b22" stroke="#58a6ff" stroke-dasharray="4 3"/>
    <text x="450" y="221" text-anchor="middle" font-size="13" fill="#c9d1d9">规则填充</text>
    <text x="450" y="240" text-anchor="middle" font-size="11" fill="#8b949e">降级，不再重试</text>
    <path d="M520 225 H630 V148" fill="none" stroke="#58a6ff" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar-blue)"/>

    <!-- 底部说明 -->
    <text x="380" y="285" text-anchor="middle" font-size="11" fill="#8b949e">每个节点幂等；失败从最后一个完成的 checkpoint 续跑，不整表重来</text>
  </g>
</svg>
